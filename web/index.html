<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyla-Gen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #2196F3;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #2196F3;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #90caf9;
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid #333;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-indicator.error {
            background: #f44336;
        }

        .status-indicator.loading {
            background: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(33, 150, 243, 0.05);
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel h2 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 10px;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            max-height: 300px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .message.user {
            background: rgba(33, 150, 243, 0.2);
            color: #90caf9;
            text-align: right;
        }

        .message.assistant {
            background: rgba(76, 175, 80, 0.2);
            color: #c8e6c9;
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input, textarea, select {
            padding: 10px;
            border: 1px solid #2196F3;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.9em;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #64b5f6;
            background: rgba(0, 0, 0, 0.7);
        }

        .chat-input {
            flex: 1;
            min-height: 40px;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2196F3 0%, #1976d2 100%);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 100px;
        }

        button:hover {
            background: linear-gradient(135deg, #64b5f6 0%, #2196F3 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .agent-panel {
            grid-column: 1 / 2;
        }

        .info-panel {
            grid-column: 2 / 3;
        }

        @media (max-width: 1024px) {
            .agent-panel, .info-panel {
                grid-column: 1;
            }
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section h3 {
            color: #90caf9;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            font-size: 0.85em;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
        }

        .value {
            color: #90caf9;
            font-weight: 600;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ff7043;
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #81c784;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2196F3;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
    <header>
        <h1>🧠 Tyla-Gen</h1>
        <p class="subtitle">All-in-One AI Server Running in GitHub Codespaces</p>
    </header>

    <div class="status-bar">
        <div class="status-item">
            <div class="status-indicator" id="serverStatus"></div>
            <span>Server: <span id="serverStatusText">Checking...</span></span>
        </div>
        <div class="status-item">
            <div class="status-indicator" id="modelStatus"></div>
            <span>Model: <span id="modelStatusText">Checking...</span></span>
        </div>
        <div class="status-item">
            <span>Engine: <span id="engineText">Local CPU</span></span>
        </div>
    </div>

    <div class="container">
        <!-- Chatbot Panel -->
        <div class="panel">
            <h2>💬 Chatbot Mode</h2>
            <div class="chat-area">
                <div class="messages" id="chatMessages"></div>
                <div class="input-area">
                    <textarea class="chat-input" id="chatInput" placeholder="Type your message..."></textarea>
                    <button id="sendBtn" onclick="sendChat()">Send</button>
                </div>
                <button onclick="clearChat()" style="background: #666;">Clear</button>
            </div>
        </div>

        <!-- Agent & Info Panel -->
        <div>
            <div class="panel agent-panel">
                <h2>🤖 Agent Mode</h2>
                <div class="chat-area">
                    <textarea class="chat-input" id="agentTask" placeholder="Describe a task (e.g., 'Calculate 25 * 4')"></textarea>
                    <select id="toolSelect" style="margin-bottom: 10px;">
                        <option value="">All Tools</option>
                        <option value="calculator">Calculator</option>
                        <option value="time">Time/Date</option>
                        <option value="http_analyzer">HTTP Analyzer</option>
                        <option value="json_processor">JSON Processor</option>
                        <option value="text_analyzer">Text Analyzer</option>
                        <option value="file_sandbox">File Sandbox</option>
                    </select>
                    <button id="agentBtn" onclick="executeAgent()">Execute Agent</button>
                </div>
                <div class="messages" id="agentMessages" style="margin-top: 10px;"></div>
            </div>

            <div class="panel info-panel">
                <h2>ℹ️ System Info</h2>
                <div class="info-section">
                    <h3>Hardware</h3>
                    <div class="info-item">
                        <span class="label">CPU Cores:</span>
                        <span class="value" id="cpuCores">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">RAM:</span>
                        <span class="value" id="ramSize">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Disk:</span>
                        <span class="value" id="diskSize">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">GPU:</span>
                        <span class="value" id="gpuStatus">-</span>
                    </div>
                </div>
                <div class="info-section">
                    <h3>Model</h3>
                    <div class="info-item">
                        <span class="label">Name:</span>
                        <span class="value" id="modelName">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Engine:</span>
                        <span class="value" id="inferenceEngine">llama-cpp-python</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Status:</span>
                        <span class="value" id="modelLoadStatus">-</span>
                    </div>
                </div>
                <div class="info-section">
                    <h3>Connection</h3>
                    <div class="info-item">
                        <span class="label">API URL:</span>
                        <span class="value" id="apiUrl">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const API_KEY = localStorage.getItem('tyla_api_key') || prompt('Enter API Key:');
        
        if (API_KEY) {
            localStorage.setItem('tyla_api_key', API_KEY);
        }

        function getHeaders() {
            return {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        async function updateStatus() {
            try {
                const healthResp = await fetch(`${API_URL}/health`);
                if (healthResp.ok) {
                    document.getElementById('serverStatus').className = 'status-indicator';
                    document.getElementById('serverStatusText').textContent = 'Online';
                } else {
                    throw new Error('Health check failed');
                }

                const statusResp = await fetch(`${API_URL}/v1/status`, { headers: getHeaders() });
                if (statusResp.ok) {
                    const data = await statusResp.json();
                    
                    document.getElementById('modelStatus').className = 'status-indicator' + (data.model_loaded ? '' : ' error');
                    document.getElementById('modelStatusText').textContent = data.model_loaded ? 'Loaded' : 'Not Loaded';
                    document.getElementById('modelName').textContent = data.model || '-';
                    document.getElementById('modelLoadStatus').textContent = data.model_loaded ? 'Ready' : 'Offline';
                    document.getElementById('inferenceEngine').textContent = data.inference_engine || 'local';

                    if (data.hardware) {
                        document.getElementById('cpuCores').textContent = data.hardware.cpu_cores;
                        document.getElementById('ramSize').textContent = data.hardware.ram_gb + 'GB';
                        document.getElementById('diskSize').textContent = data.hardware.disk_gb + 'GB';
                        document.getElementById('gpuStatus').textContent = data.hardware.gpu_available ? 'Available' : 'None';
                    }
                }
            } catch (error) {
                document.getElementById('serverStatus').className = 'status-indicator error';
                document.getElementById('serverStatusText').textContent = 'Offline';
                document.getElementById('modelStatus').className = 'status-indicator error';
                document.getElementById('modelStatusText').textContent = 'Error';
            }
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            
            document.getElementById('sendBtn').disabled = true;
            addMessage('assistant', '...');
            
            try {
                const resp = await fetch(`${API_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        temperature: 0.7,
                        max_tokens: 2048
                    })
                });
                
                if (resp.ok) {
                    const data = await resp.json();
                    const text = data.choices[0].text;
                    
                    const msgs = document.getElementById('chatMessages');
                    msgs.lastChild.textContent = text;
                    msgs.scrollTop = msgs.scrollHeight;
                } else {
                    const text = await resp.text();
                    addMessage('assistant', `Error: ${resp.status} - ${text}`);
                }
            } catch (error) {
                addMessage('assistant', `Error: ${error.message}`);
            } finally {
                document.getElementById('sendBtn').disabled = false;
            }
        }

        async function executeAgent() {
            const task = document.getElementById('agentTask').value.trim();
            const tool = document.getElementById('toolSelect').value;
            
            if (!task) return;
            
            document.getElementById('agentBtn').disabled = true;
            document.getElementById('agentMessages').innerHTML = '<div class="message">Executing...</div>';
            
            try {
                const resp = await fetch(`${API_URL}/v1/agent`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        task: task,
                        available_tools: tool ? [tool] : undefined
                    })
                });
                
                if (resp.ok) {
                    const data = await resp.json();
                    const msgs = document.getElementById('agentMessages');
                    msgs.innerHTML = '';
                    
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'message success';
                    resultDiv.textContent = data.result;
                    msgs.appendChild(resultDiv);
                    
                    if (data.state && data.state.tool_used) {
                        const toolDiv = document.createElement('div');
                        toolDiv.className = 'message';
                        toolDiv.textContent = `Tool: ${data.state.tool_used}`;
                        msgs.appendChild(toolDiv);
                    }
                } else {
                    const text = await resp.text();
                    const msgs = document.getElementById('agentMessages');
                    msgs.innerHTML = `<div class="message error">Error: ${resp.status} - ${text}</div>`;
                }
            } catch (error) {
                document.getElementById('agentMessages').innerHTML = `<div class="message error">Error: ${error.message}</div>`;
            } finally {
                document.getElementById('agentBtn').disabled = false;
            }
        }

        function addMessage(role, content) {
            const msgs = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = content;
            msgs.appendChild(msg);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chatMessages').innerHTML = '';
        }

        document.getElementById('apiUrl').textContent = API_URL;
        
        updateStatus();
        setInterval(updateStatus, 5000);

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
    </script>
</body>
</html>
